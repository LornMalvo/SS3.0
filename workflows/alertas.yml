# Única carpeta del repo: GitHub Actions exige esta ruta.
# Corre cada hora en horario de mercado (13:00-21:00 UTC, L-V) más un pase
# al cierre. Los secretos se configuran en Settings > Secrets del repo.
name: alertas
on:
  schedule:
    - cron: "5 13-21 * * 1-5"
  workflow_dispatch:
jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tarea_alertas.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
